<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#FFFFFA; font-family:'JetBrains Mono', 'Courier New', monospace;">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#D0D5DD" />
    </pattern>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#840000"/>
    </marker>
  </defs>

  <rect width="1000" height="650" fill="url(#grid2)" />
  <rect width="990" height="640" x="5" y="5" fill="none" stroke="#840000" stroke-width="1.5" />
  <rect width="982" height="632" x="9" y="9" fill="none" stroke="#840000" stroke-width="0.75" />

  <!-- KiCad Title Block -->
  <g transform="translate(680, 520)">
    <rect width="310" height="120" fill="#FFFFFA" stroke="#840000" stroke-width="1.2" />
    <line x1="0" y1="30" x2="310" y2="30" stroke="#840000" stroke-width="0.8" />
    <line x1="0" y1="65" x2="310" y2="65" stroke="#840000" stroke-width="0.8" />
    <line x1="0" y1="92" x2="310" y2="92" stroke="#840000" stroke-width="0.8" />
    <line x1="180" y1="92" x2="180" y2="120" stroke="#840000" stroke-width="0.8" />
    
    <text x="10" y="20" font-size="11" fill="#840000" font-weight="bold">KiCad E.E.Schematic v10.0</text>
    <text x="10" y="48" font-size="13" fill="#000084" font-weight="bold">IC 555 Motor Speed Control</text>
    <text x="10" y="82" font-size="11" fill="#333">Design: R. Vijaya Baskaran (ECE)</text>
    <text x="10" y="108" font-size="10" fill="#555">Date: 2026-02-03</text>
    <text x="190" y="108" font-size="10" fill="#555">Rev: 1.5 (KiCad)</text>
  </g>

  <!-- Title on Canvas -->
  <text x="40" y="45" font-size="18" font-weight="bold" fill="#000084">PWM DC MOTOR SPEED CONTROLLER SCHEMATIC</text>
  <text x="40" y="65" font-size="11" fill="#555">NE555 Variable Duty Cycle PWM Generator &bull; IRLZ44N Logic-Level MOSFET &bull; Inductive Snubber</text>

  <!-- Wires & Junctions (KiCad Red #840000) -->
  <g stroke="#840000" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Power Rails: VCC (+12V Battery Input) -->
    <path d="M 80 120 L 450 120 L 750 120 L 850 120" />
    <!-- Ground Rail -->
    <path d="M 80 440 L 450 440 L 750 440 L 850 440" />

    <!-- 555 Power Connections: Pin 8 (VCC) & Pin 4 (RESET) to +12V -->
    <path d="M 380 120 L 380 180" />
    <path d="M 430 120 L 430 180" />
    <!-- Pin 1 (GND) to Ground -->
    <path d="M 380 340 L 380 440" />

    <!-- Potentiometer & Steering Diodes PWM Network (Pin 7 Discharge) -->
    <path d="M 320 230 L 220 230 L 220 170 L 260 170" />
    <path d="M 220 230 L 220 290 L 260 290" />
    <path d="M 320 170 L 350 170 L 350 210 L 320 210" />
    <path d="M 320 290 L 350 290 L 350 270" />

    <!-- Potentiometer Wiper to Pin 7 -->
    <path d="M 180 230 L 220 230" />

    <!-- Trigger (Pin 2) & Threshold (Pin 6) tied together to Timing Cap C1 -->
    <path d="M 320 260 L 290 260 L 290 320 L 320 320" />
    <path d="M 290 290 L 240 290 L 240 370 L 240 440" />

    <!-- Control Voltage Pin 5 to Decoupling Cap C2 -->
    <path d="M 450 340 L 450 380 L 480 380 L 480 440" />

    <!-- Output (Pin 3) to Gate Resistor R1 -->
    <path d="M 520 260 L 590 260 L 630 260" />
    <!-- Gate Pull-Down Resistor R2 -->
    <path d="M 610 260 L 610 380 L 610 440" />

    <!-- MOSFET Q1 Connections -->
    <!-- Gate Pin to R1 -->
    <path d="M 670 260 L 700 260" />
    <!-- Source to Ground -->
    <path d="M 730 310 L 730 440" />
    <!-- Drain to Motor Negative & Flyback Diode Anode -->
    <path d="M 730 210 L 730 180 L 800 180 L 800 220" />

    <!-- Motor & Diode to VCC (+12V) -->
    <path d="M 800 120 L 800 160" />
    <path d="M 800 160 L 850 160 L 850 220" />
    <path d="M 850 280 L 850 320 L 800 320 L 800 180" />
  </g>

  <!-- Junction Dots -->
  <g fill="#840000">
    <circle cx="380" cy="120" r="3.5" />
    <circle cx="430" cy="120" r="3.5" />
    <circle cx="380" cy="440" r="3.5" />
    <circle cx="290" cy="260" r="3.5" />
    <circle cx="290" cy="320" r="3.5" />
    <circle cx="240" cy="440" r="3.5" />
    <circle cx="610" cy="260" r="3.5" />
    <circle cx="610" cy="440" r="3.5" />
    <circle cx="730" cy="440" r="3.5" />
    <circle cx="800" cy="120" r="3.5" />
    <circle cx="800" cy="180" r="3.5" />
  </g>

  <!-- TP1: Power Input Connector (Terminal Block 1x02) -->
  <g transform="translate(30, 240)">
    <rect width="50" height="120" fill="#E8EEF5" stroke="#000084" stroke-width="1.8" rx="4"/>
    <circle cx="25" cy="25" r="7" fill="#FFF" stroke="#000084" stroke-width="1.5" />
    <circle cx="25" cy="95" r="7" fill="#FFF" stroke="#000084" stroke-width="1.5" />
    <text x="-15" y="-10" font-size="12" font-weight="bold" fill="#000084">TP1 (BATTERY)</text>
    <text x="12" y="30" font-size="11" font-weight="bold" fill="#C00">+</text>
    <text x="12" y="100" font-size="13" font-weight="bold" fill="#00C">−</text>
    <!-- Line to VCC / GND -->
    <path d="M 80 265 L 80 120" stroke="#840000" stroke-width="1.8" fill="none" />
    <path d="M 80 335 L 80 440" stroke="#840000" stroke-width="1.8" fill="none" />
  </g>

  <!-- U1: NE555 Timer IC (SOIC-8 / DIP-8) -->
  <g transform="translate(320, 180)">
    <rect width="200" height="160" fill="#FEFCE8" stroke="#000084" stroke-width="2" rx="4"/>
    <text x="75" y="35" font-size="16" font-weight="bold" fill="#000084">NE555</text>
    <text x="80" y="55" font-size="11" fill="#555">TIMER IC</text>
    
    <!-- Pin Labels Left -->
    <text x="10" y="35" font-size="11" fill="#333">4 RESET</text>
    <text x="10" y="60" font-size="11" fill="#333">7 DISCH</text>
    <text x="10" y="85" font-size="11" fill="#333">2 TRIG</text>
    <text x="10" y="145" font-size="11" fill="#333">6 THRESH</text>
    
    <!-- Pin Labels Right / Top / Bottom -->
    <text x="135" y="35" font-size="11" fill="#333">8 VCC</text>
    <text x="135" y="85" font-size="11" fill="#333">3 OUT</text>
    <text x="135" y="145" font-size="11" fill="#333">5 CTRL</text>
    <text x="85" y="152" font-size="11" fill="#333">1 GND</text>

    <!-- Component Designator -->
    <text x="75" y="-10" font-size="13" font-weight="bold" fill="#000084">U1 (NE555D)</text>
  </g>

  <!-- J1: 3-Pin Potentiometer Interface Header (PinSocket 1x03) -->
  <g transform="translate(130, 200)">
    <rect width="50" height="60" fill="#E8EEF5" stroke="#000084" stroke-width="1.5" rx="3"/>
    <circle cx="25" cy="15" r="5" fill="#FFF" stroke="#000084"/>
    <circle cx="25" cy="30" r="5" fill="#D4AF37" stroke="#000084"/>
    <circle cx="25" cy="45" r="5" fill="#FFF" stroke="#000084"/>
    <text x="-4" y="-8" font-size="11" font-weight="bold" fill="#000084">J1 (POT 100k)</text>
    <text x="5" y="75" font-size="9" fill="#555">Duty Cycle Control</text>
  </g>

  <!-- Steering Diodes D1, D2 (1N4148 for Independent Charge/Discharge Paths) -->
  <g transform="translate(260, 155)">
    <!-- D1: Top Diode (Charging path) -->
    <polygon points="15,5 35,15 15,25" fill="#000084" stroke="#000084"/>
    <line x1="35" y1="5" x2="35" y2="25" stroke="#000084" stroke-width="2"/>
    <text x="10" y="-5" font-size="10" font-weight="bold" fill="#000084">D1 (1N4148)</text>
  </g>
  <g transform="translate(260, 275)">
    <!-- D2: Bottom Diode (Discharge path) -->
    <polygon points="35,5 15,15 35,25" fill="#000084" stroke="#000084"/>
    <line x1="15" y1="5" x2="15" y2="25" stroke="#000084" stroke-width="2"/>
    <text x="10" y="42" font-size="10" font-weight="bold" fill="#000084">D2 (1N4148)</text>
  </g>

  <!-- C1: Timing Capacitor (0.1uF) -->
  <g transform="translate(225, 380)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#000084" stroke-width="2.5" />
    <line x1="0" y1="20" x2="30" y2="20" stroke="#000084" stroke-width="2.5" />
    <text x="35" y="14" font-size="11" font-weight="bold" fill="#000084">C1</text>
    <text x="35" y="27" font-size="10" fill="#008484">0.1µF</text>
  </g>

  <!-- C2: Control Bypass Capacitor (10nF) -->
  <g transform="translate(465, 390)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#000084" stroke-width="2.5" />
    <line x1="0" y1="20" x2="30" y2="20" stroke="#000084" stroke-width="2.5" />
    <text x="35" y="14" font-size="11" font-weight="bold" fill="#000084">C2</text>
    <text x="35" y="27" font-size="10" fill="#008484">10nF</text>
  </g>

  <!-- R1: Gate Series Resistor (47Ω) -->
  <g transform="translate(620, 245)">
    <rect width="40" height="24" fill="#FFF" stroke="#008484" stroke-width="1.5"/>
    <text x="10" y="16" font-size="11" font-weight="bold" fill="#008484">47Ω</text>
    <text x="10" y="-6" font-size="11" font-weight="bold" fill="#000084">R1</text>
  </g>

  <!-- R2: Gate Pull-Down Resistor (10kΩ) -->
  <g transform="translate(595, 330)">
    <rect width="30" height="40" fill="#FFF" stroke="#008484" stroke-width="1.5"/>
    <text x="4" y="24" font-size="10" font-weight="bold" fill="#008484">10kΩ</text>
    <text x="36" y="24" font-size="10" font-weight="bold" fill="#000084">R2</text>
  </g>

  <!-- Q1: IRLZ44N N-Channel Logic-Level Power MOSFET -->
  <g transform="translate(700, 230)">
    <circle cx="25" cy="30" r="32" fill="#E8F4FD" stroke="#000084" stroke-width="1.8"/>
    <!-- Drain, Gate, Source paths -->
    <line x1="10" y1="10" x2="10" y2="50" stroke="#000084" stroke-width="3"/>
    <line x1="-5" y1="30" x2="10" y2="30" stroke="#840000" stroke-width="2"/>
    <line x1="20" y1="10" x2="35" y2="10" stroke="#840000" stroke-width="2"/>
    <line x1="35" y1="10" x2="35" y2="-20" stroke="#840000" stroke-width="2"/>
    <line x1="20" y1="50" x2="35" y2="50" stroke="#840000" stroke-width="2"/>
    <line x1="35" y1="50" x2="35" y2="80" stroke="#840000" stroke-width="2"/>
    <!-- Channel substrate arrow -->
    <polygon points="12,30 24,25 24,35" fill="#840000"/>
    <text x="10" y="-28" font-size="12" font-weight="bold" fill="#000084">Q1 (IRLZ44N)</text>
    <text x="-15" y="25" font-size="10" fill="#000">G</text>
    <text x="42" y="5" font-size="10" fill="#000">D</text>
    <text x="42" y="65" font-size="10" fill="#000">S</text>
    <text x="-4" y="75" font-size="9" fill="#555">TO-220-3</text>
  </g>

  <!-- D_Flyback: 1N4007 Diode Across Motor -->
  <g transform="translate(835, 240)">
    <polygon points="15,35 15,10 30,22" fill="#000084" stroke="#000084"/>
    <line x1="30" y1="8" x2="30" y2="37" stroke="#000084" stroke-width="2"/>
    <text x="-35" y="26" font-size="11" font-weight="bold" fill="#000084">D_FLYBACK</text>
    <text x="-25" y="40" font-size="10" fill="#555">1N4007</text>
  </g>

  <!-- TP2: Motor Output Terminal (1x02) & Motor Symbol -->
  <g transform="translate(760, 220)">
    <circle cx="20" cy="20" r="18" fill="#FFF8DC" stroke="#000084" stroke-width="2"/>
    <text x="14" y="26" font-size="16" font-weight="bold" fill="#000084">M</text>
    <text x="-5" y="-12" font-size="11" font-weight="bold" fill="#000084">TP2 (MOTOR)</text>
    <text x="5" y="52" font-size="10" fill="#555">DC Motor</text>
  </g>

  <!-- Circuit Operation Theory Box -->
  <g transform="translate(40, 480)">
    <rect width="610" height="135" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" rx="4"/>
    <text x="15" y="24" font-size="12" font-weight="bold" fill="#166534">⚙ PWM MOTOR SPEED CONTROLLER THEORY OF OPERATION:</text>
    <text x="15" y="45" font-size="11" fill="#14532D">1. Steering Diode Duty Control: Potentiometer wiper directs charge current through D1 and discharge through D2.</text>
    <text x="15" y="65" font-size="11" fill="#14532D">2. Wide Duty Cycle Range: Achieves 1% to 99% PWM regulation without shifting the base oscillation frequency (~1.5 kHz).</text>
    <text x="15" y="85" font-size="11" fill="#14532D">3. Low-Rds(on) Switching: Logic-level IRLZ44N (Rds &approx; 0.028 &Omega;) minimizes power dissipation and heatsink requirements.</text>
    <text x="15" y="105" font-size="11" fill="#14532D">4. Inductive Snubbing: 1N4007 clamping diode protects the MOSFET drain from high voltage back-EMF spikes during motor turn-off.</text>
    <text x="15" y="123" font-size="10" font-style="italic" fill="#15803D">PCB Routing: 99 track segments, 13 vias, low-inductance ground pour pour plane. Clean DRC verified in KiCad.</text>
  </g>
</svg>
