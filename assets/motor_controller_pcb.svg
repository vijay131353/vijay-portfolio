<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" style="background:#0F172A; font-family:'JetBrains Mono', monospace;">
  <defs>
    <pattern id="pcb-grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" />
    </pattern>
  </defs>

  <rect width="900" height="600" fill="url(#pcb-grid2)" />

  <!-- PCB Board Substrate (FR-4 Dark Green #0A2616) -->
  <g transform="translate(100, 50)">
    <!-- Board Substrate with round corners -->
    <rect width="700" height="500" rx="14" fill="#0A2616" stroke="#E2E8F0" stroke-width="2.5" />
    <!-- Ground Pour Layer Hatching -->
    <rect width="688" height="488" x="6" y="6" rx="10" fill="#0D331E" opacity="0.9" />

    <!-- Corner Mounting Holes -->
    <g fill="#0F172A" stroke="#D4AF37" stroke-width="3">
      <circle cx="28" cy="28" r="10" />
      <circle cx="672" cy="28" r="10" />
      <circle cx="28" cy="472" r="10" />
      <circle cx="672" cy="472" r="10" />
    </g>
    <circle cx="28" cy="28" r="4.5" fill="#0F172A" />
    <circle cx="672" cy="28" r="4.5" fill="#0F172A" />
    <circle cx="28" cy="472" r="4.5" fill="#0F172A" />
    <circle cx="672" cy="472" r="4.5" fill="#0F172A" />

    <!-- Silkscreen Header Text -->
    <text x="30" y="55" font-size="14" font-weight="bold" fill="#F8FAFC" letter-spacing="1">R. VIJAYA BASKARAN &bull; IC 555 MOTOR SPEED CONTROLLER</text>
    <text x="30" y="74" font-size="11" fill="#94A3B8">REV 1.5 &bull; 99 TRACKS &bull; 13 VIAS &bull; 2-LAYER FR-4 &bull; COPPER POUR GROUND PLANE</text>

    <!-- ================= COPPER TRACKS ================= -->
    <!-- B.Cu (Bottom Layer Copper Blue #3B82F6 - Power & Ground Return) -->
    <g stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
      <path d="M 80 180 L 140 180 L 140 320 L 220 320" />
      <path d="M 80 320 L 160 320 L 240 400 L 460 400" />
      <path d="M 220 320 L 320 320 L 320 280" />
      <path d="M 380 280 L 380 340 L 460 340" />
      <path d="M 520 280 L 520 400 L 620 400" />
      <path d="M 620 280 L 620 220 L 540 220" />
    </g>

    <!-- F.Cu (Top Layer Copper Red #EF4444 - Signal & Gate Drive) -->
    <g stroke="#EF4444" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <path d="M 220 180 L 290 180 L 290 220 L 340 220" />
      <path d="M 290 220 L 290 260 L 340 260" />
      <path d="M 380 220 L 440 220 L 440 260" />
      <path d="M 440 260 L 490 260 L 520 260" />
      <path d="M 520 240 L 580 240 L 580 180" />
      <path d="M 520 280 L 580 280 L 580 340" />
    </g>

    <!-- Vias (13 KiCad Vias with annular ring) -->
    <g fill="#D4AF37" stroke="#0F172A" stroke-width="1.5">
      <circle cx="140" cy="180" r="5" /><circle cx="140" cy="180" r="1.8" fill="#0F172A" />
      <circle cx="140" cy="320" r="5" /><circle cx="140" cy="320" r="1.8" fill="#0F172A" />
      <circle cx="220" cy="320" r="5" /><circle cx="220" cy="320" r="1.8" fill="#0F172A" />
      <circle cx="290" cy="220" r="5" /><circle cx="290" cy="220" r="1.8" fill="#0F172A" />
      <circle cx="380" cy="280" r="5" /><circle cx="380" cy="280" r="1.8" fill="#0F172A" />
      <circle cx="440" cy="260" r="5" /><circle cx="440" cy="260" r="1.8" fill="#0F172A" />
      <circle cx="460" cy="340" r="5" /><circle cx="460" cy="340" r="1.8" fill="#0F172A" />
      <circle cx="520" cy="240" r="5" /><circle cx="520" cy="240" r="1.8" fill="#0F172A" />
      <circle cx="520" cy="280" r="5" /><circle cx="520" cy="280" r="1.8" fill="#0F172A" />
      <circle cx="580" cy="180" r="5" /><circle cx="580" cy="180" r="1.8" fill="#0F172A" />
      <circle cx="580" cy="280" r="5" /><circle cx="580" cy="280" r="1.8" fill="#0F172A" />
      <circle cx="620" cy="280" r="5" /><circle cx="620" cy="280" r="1.8" fill="#0F172A" />
      <circle cx="460" cy="400" r="5" /><circle cx="460" cy="400" r="1.8" fill="#0F172A" />
    </g>

    <!-- ================= SILKSCREEN & COMPONENTS ================= -->

    <!-- TP1: Power Input Terminal (Battery 12V) -->
    <g transform="translate(60, 210)">
      <rect width="45" height="110" fill="none" stroke="#F8FAFC" stroke-width="1.8" rx="2" />
      <circle cx="22" cy="25" r="11" fill="#D4AF37" stroke="#FFF" stroke-width="1.2" />
      <circle cx="22" cy="25" r="4.5" fill="#0A2616" />
      <circle cx="22" cy="85" r="11" fill="#D4AF37" stroke="#FFF" stroke-width="1.2" />
      <circle cx="22" cy="85" r="4.5" fill="#0A2616" />
      <text x="8" y="15" font-size="11" font-weight="bold" fill="#F8FAFC">TP1</text>
      <text x="12" y="45" font-size="11" font-weight="bold" fill="#EF4444">+V</text>
      <text x="12" y="75" font-size="12" font-weight="bold" fill="#3B82F6">GND</text>
      <text x="-4" y="130" font-size="9" fill="#94A3B8">POWER IN</text>
    </g>

    <!-- J1: 3-Pin Potentiometer Header (PinSocket 1x03, 2.00mm) -->
    <g transform="translate(150, 160)">
      <rect width="45" height="90" fill="none" stroke="#F8FAFC" stroke-width="1.5" rx="2" />
      <circle cx="22" cy="20" r="7" fill="#D4AF37" /><circle cx="22" cy="20" r="2.8" fill="#0A2616" />
      <circle cx="22" cy="45" r="7" fill="#D4AF37" /><circle cx="22" cy="45" r="2.8" fill="#0A2616" />
      <circle cx="22" cy="70" r="7" fill="#D4AF37" /><circle cx="22" cy="70" r="2.8" fill="#0A2616" />
      <text x="12" y="10" font-size="10" font-weight="bold" fill="#F8FAFC">J1</text>
      <text x="-8" y="105" font-size="9" fill="#CBD5E1">POT (100k)</text>
    </g>

    <!-- D1, D2: 1N4148 Steering Diodes (DO-35) -->
    <g transform="translate(230, 150)">
      <rect width="60" height="24" fill="none" stroke="#F8FAFC" stroke-width="1.2" rx="2" />
      <line x1="18" y1="0" x2="18" y2="24" stroke="#FFF" stroke-width="2.5" />
      <circle cx="8" cy="12" r="6" fill="#D4AF37" /><circle cx="52" cy="12" r="6" fill="#D4AF37" />
      <text x="25" y="16" font-size="9" fill="#FFF">D1</text>
    </g>
    <g transform="translate(230, 200)">
      <rect width="60" height="24" fill="none" stroke="#F8FAFC" stroke-width="1.2" rx="2" />
      <line x1="42" y1="0" x2="42" y2="24" stroke="#FFF" stroke-width="2.5" />
      <circle cx="8" cy="12" r="6" fill="#D4AF37" /><circle cx="52" cy="12" r="6" fill="#D4AF37" />
      <text x="25" y="16" font-size="9" fill="#FFF">D2</text>
    </g>

    <!-- U1: NE555D SOIC-8 Footprint with SMD Pads -->
    <g transform="translate(320, 200)">
      <rect width="65" height="95" fill="none" stroke="#F8FAFC" stroke-width="1.5" rx="2" />
      <!-- Pin 1 index notch -->
      <circle cx="15" cy="15" r="4" fill="#FFF" />
      <!-- 8 Surface Mount Pads -->
      <rect x="-14" y="12" width="16" height="8" rx="1.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.8"/>
      <rect x="-14" y="32" width="16" height="8" rx="1.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.8"/>
      <rect x="-14" y="52" width="16" height="8" rx="1.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.8"/>
      <rect x="-14" y="72" width="16" height="8" rx="1.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.8"/>
      <rect x="63" y="12" width="16" height="8" rx="1.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.8"/>
      <rect x="63" y="32" width="16" height="8" rx="1.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.8"/>
      <rect x="63" y="52" width="16" height="8" rx="1.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.8"/>
      <rect x="63" y="72" width="16" height="8" rx="1.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.8"/>
      <text x="14" y="45" font-size="11" font-weight="bold" fill="#F8FAFC">NE555</text>
      <text x="22" y="60" font-size="9" fill="#94A3B8">U1 (SO-8)</text>
    </g>

    <!-- Timing & Bypass Capacitors C1, C2 -->
    <g transform="translate(250, 260)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="#F8FAFC" stroke-width="1.2" />
      <circle cx="10" cy="15" r="5" fill="#D4AF37" /><circle cx="20" cy="15" r="5" fill="#D4AF37" />
      <text x="5" y="40" font-size="9" fill="#FFF">C1</text>
    </g>
    <g transform="translate(250, 320)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="#F8FAFC" stroke-width="1.2" />
      <circle cx="10" cy="15" r="5" fill="#D4AF37" /><circle cx="20" cy="15" r="5" fill="#D4AF37" />
      <text x="5" y="40" font-size="9" fill="#FFF">C2</text>
    </g>

    <!-- Resistors R1 (Gate Series) and R2 (Pull-Down) -->
    <g transform="translate(420, 220)">
      <rect width="25" height="70" fill="none" stroke="#F8FAFC" stroke-width="1.2" />
      <circle cx="12" cy="12" r="6" fill="#D4AF37" /><circle cx="12" cy="58" r="6" fill="#D4AF37" />
      <text x="5" y="40" font-size="9" fill="#FFF">R1</text>
    </g>
    <g transform="translate(460, 280)">
      <rect width="25" height="70" fill="none" stroke="#F8FAFC" stroke-width="1.2" />
      <circle cx="12" cy="12" r="6" fill="#D4AF37" /><circle cx="12" cy="58" r="6" fill="#D4AF37" />
      <text x="5" y="40" font-size="9" fill="#FFF">R2</text>
    </g>

    <!-- Q1: IRLZ44N TO-220-3 N-Channel MOSFET -->
    <g transform="translate(505, 190)">
      <rect width="65" height="110" fill="none" stroke="#F8FAFC" stroke-width="1.8" rx="2" />
      <line x1="0" y1="20" x2="65" y2="20" stroke="#FFF" stroke-width="2.5" />
      <circle cx="15" cy="90" r="7" fill="#D4AF37" /><circle cx="15" cy="90" r="2.8" fill="#0A2616" />
      <circle cx="32" cy="90" r="7" fill="#D4AF37" /><circle cx="32" cy="90" r="2.8" fill="#0A2616" />
      <circle cx="50" cy="90" r="7" fill="#D4AF37" /><circle cx="50" cy="90" r="2.8" fill="#0A2616" />
      <circle cx="32" cy="10" r="6" fill="#D4AF37" /><circle cx="32" cy="10" r="3" fill="#0A2616" />
      <text x="10" y="42" font-size="10" font-weight="bold" fill="#F8FAFC">IRLZ44N</text>
      <text x="20" y="60" font-size="10" fill="#CBD5E1">Q1</text>
      <text x="10" y="125" font-size="9" fill="#94A3B8">G &bull; D &bull; S</text>
    </g>

    <!-- D_Flyback: 1N4007 Diode across Motor terminals -->
    <g transform="translate(575, 140)">
      <rect width="60" height="26" fill="none" stroke="#F8FAFC" stroke-width="1.2" rx="2" />
      <line x1="18" y1="0" x2="18" y2="26" stroke="#FFF" stroke-width="2.5" />
      <circle cx="8" cy="13" r="6" fill="#D4AF37" /><circle cx="52" cy="13" r="6" fill="#D4AF37" />
      <text x="22" y="17" font-size="9" fill="#FFF">1N4007</text>
    </g>

    <!-- TP2: Motor Output Terminal (1x02) -->
    <g transform="translate(615, 200)">
      <rect width="45" height="110" fill="none" stroke="#F8FAFC" stroke-width="1.8" rx="2" />
      <circle cx="22" cy="25" r="11" fill="#D4AF37" stroke="#FFF" stroke-width="1.2" />
      <circle cx="22" cy="25" r="4.5" fill="#0A2616" />
      <circle cx="22" cy="85" r="11" fill="#D4AF37" stroke="#FFF" stroke-width="1.2" />
      <circle cx="22" cy="85" r="4.5" fill="#0A2616" />
      <text x="8" y="15" font-size="11" font-weight="bold" fill="#F8FAFC">TP2</text>
      <text x="8" y="45" font-size="10" font-weight="bold" fill="#EF4444">M(+)</text>
      <text x="8" y="75" font-size="10" font-weight="bold" fill="#3B82F6">M(-)</text>
      <text x="-4" y="130" font-size="9" fill="#94A3B8">MOTOR OUT</text>
    </g>

    <!-- Layer Stackup Legend -->
    <g transform="translate(30, 420)">
      <rect width="250" height="60" fill="#061A0E" stroke="#1E293B" stroke-width="1" rx="4" />
      <line x1="15" y1="22" x2="35" y2="22" stroke="#EF4444" stroke-width="3" />
      <text x="45" y="26" font-size="9" fill="#E2E8F0">F.Cu (Top Signal &amp; Gate Drive)</text>
      <line x1="15" y1="42" x2="35" y2="42" stroke="#3B82F6" stroke-width="3" />
      <text x="45" y="46" font-size="9" fill="#E2E8F0">B.Cu (Bottom Ground Pour &amp; VCC)</text>
    </g>
  </g>
</svg>
